<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debloat</title>
<style>
:root{
  --bg:#0d0e11; --surface:#16181d; --surface-2:#1d2027; --border:#262a33;
  --text:#e8eaee; --muted:#8b919d; --accent:#6d8cff; --ok:#3fb950; --warn:#e8b923; --danger:#e5484d;
  --ease:cubic-bezier(.2,.8,.2,1);
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.5}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2a2e38;border-radius:10px;border:2px solid var(--bg)}

.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.search{flex:1;max-width:380px}
.search input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,140,255,.18)}
.summary{margin-left:auto;color:var(--muted)}
.progress{height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s var(--ease)}

.scroller{flex:1;overflow-y:auto;padding:22px 24px 110px;will-change:scroll-position}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;user-select:none;
  content-visibility:auto;contain-intrinsic-size:auto 190px;
  transition:transform .22s var(--ease),border-color .22s,background .22s,box-shadow .22s,opacity .4s,scale .4s}
.card:hover{transform:translateY(-3px);background:var(--surface-2);border-color:#343946}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px -10px rgba(109,140,255,.5);background:#1a1f2e}
.card.enter{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*18ms)}
.card.leaving{opacity:0;scale:.92;pointer-events:none}
.card[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:18px;
  background:hsl(var(--h) 55% 22%);color:hsl(var(--h) 90% 75%)}
.card h3{font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.chip{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--surface-2);color:var(--muted)}
.chip.unk{background:rgba(232,185,35,.12);color:var(--warn)}
.desc{font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;min-height:24px}
.logs{font-size:12px;color:var(--muted);padding:4px 8px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,background .2s}
.logs:hover{background:var(--surface-2);color:var(--text)}
.card[data-s] .logs{opacity:1;pointer-events:auto}
.check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-size:13px;transform:scale(0);transition:transform .25s var(--ease)}
.card.selected .check{transform:scale(1)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.badge[data-s="queue"]{color:var(--muted)}
.badge[data-s="active"],.badge[data-s="retrying"]{color:var(--warn)}
.badge[data-s="done_success"]{color:var(--ok)}
.badge[data-s="done_failed"]{color:var(--danger)}
.badge[data-s="skipped"]{color:var(--muted)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.skel{height:190px;border-radius:14px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

.bar{position:fixed;left:50%;bottom:22px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-radius:16px;
  background:rgba(29,32,39,.96);border:1px solid #343946;box-shadow:0 16px 40px -12px rgba(0,0,0,.7);
  transform:translate(-50%,140%);opacity:0;transition:transform .4s var(--ease),opacity .3s}
.bar.show{transform:translate(-50%,0);opacity:1}
.btn{padding:9px 16px;border-radius:10px;font-weight:600;transition:transform .15s,background .2s,filter .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--muted)}.btn.ghost:hover{color:var(--text)}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.danger{background:var(--danger);color:#fff}.btn.danger:hover{filter:brightness(1.1)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:30;display:flex;flex-direction:column;gap:12px;padding:20px;
  background:var(--surface);border-left:1px solid var(--border);transform:translateX(102%);transition:transform .4s var(--ease)}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer h2{font-size:16px}
.term{flex:1;overflow-y:auto;padding:14px;border-radius:12px;background:#0a0b0d;font:12.5px/1.6 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.term div{animation:fade .25s both}
.term .wait{color:var(--muted)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.modal-wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(0,0,0,.6);animation:fadein .25s both}
.modal{width:min(440px,90vw);padding:26px;border-radius:18px;background:var(--surface);border:1px solid #343946;animation:pop .35s var(--ease) both}
.modal .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(232,185,35,.14);color:var(--warn);margin-bottom:14px}
.modal h2{font-size:18px;margin-bottom:8px}
.modal p{color:var(--muted);line-height:1.5}
.modal .procs{margin:14px 0 4px;padding:10px 12px;border-radius:10px;background:var(--bg);font:12.5px Consolas,monospace;color:var(--text);max-height:110px;overflow:auto}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal-wrap.out{animation:fadeout .2s both}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}

.toast{position:fixed;top:18px;left:50%;padding:10px 18px;border-radius:12px;background:var(--surface-2);border:1px solid #343946;z-index:50;
  transform:translate(-50%,-160%);transition:transform .45s var(--ease)}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Debloat</div>
    <div class="search"><input id="q" type="search" placeholder="Search apps…" autocomplete="off"></div>
    <div class="summary" id="summary">Scanning your PC…</div>
  </header>
  <div class="progress"><i id="prog"></i></div>
  <div class="scroller"><main class="grid" id="grid"></main></div>
</div>

<div class="bar" id="bar">
  <span id="count"></span>
  <button class="btn ghost" id="clear">Clear</button>
  <button class="btn primary" id="go">Uninstall</button>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <header><h2 id="dTitle"></h2><button class="btn ghost" id="dClose">Close</button></header>
  <div class="term" id="term"></div>
  <button class="btn ghost" id="dToggle">Show raw log</button>
</aside>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const grid = $("grid"), bar = $("bar"), scrim = $("scrim"), drawer = $("drawer"), term = $("term");
const LABELS = {queue:"Queued", active:"Removing", retrying:"Retrying", done_success:"Removed", done_failed:"Failed", skipped:"Skipped"};

const appsById = new Map();   // uid -> app data
const cards = new Map();      // uid -> element
const selected = new Set();
let busy = false, batchTotal = 0, batchDone = 0, batchOk = 0;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const api = () => window.pywebview.api;

// ---------- Python -> JS events ----------
const handlers = {
  apps: ({apps, recognized, other}) => {
    appsById.clear(); cards.clear(); selected.clear();
    const frag = document.createDocumentFragment();
    apps.forEach((a, i) => {
      appsById.set(a.uid, a);
      const el = document.createElement("article");
      el.className = "card enter";
      el.style.setProperty("--i", Math.min(i, 24));   // stagger only the first screenful
      el.dataset.uid = a.uid;
      el.dataset.name = a.name.toLowerCase();
      el.innerHTML =
        `<div class="check">✓</div>
         <div class="avatar" style="--h:${hue(a.name)}">${esc((a.name.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase())}</div>
         <div><h3>${esc(a.name)}</h3><span class="chip ${a.curated ? "" : "unk"}">${a.curated ? esc(a.category) : "Unrecognized"}</span></div>
         ${a.description ? `<p class="desc">${esc(a.description)}</p>` : ""}
         <div class="foot"><span class="badge"></span><button class="logs" data-act="logs">Logs</button></div>`;
      cards.set(a.uid, el);
      frag.appendChild(el);
    });
    grid.replaceChildren(frag);
    $("summary").textContent = `${recognized} recognized · ${other} others`;
    applyFilter();
  },
  status: ({uid, status}) => setStatus(uid, status),
  log: ({uid, raw, friendly}) => {
    if (uid !== drawerUid) return;
    drawerData.raw.push(raw);
    if (friendly != null) drawerData.friendly.push(friendly);
    if (showRaw) appendLine(raw); else if (friendly != null) appendLine(friendly);
  },
  in_use: ({uid, processes}) => { modalQueue.push({uid, processes}); showNextModal(); },
  batch_done: () => {
    busy = false;
    const failed = batchTotal - batchOk;
    toast(failed ? `Finished — ${batchOk} removed, ${failed} didn't complete` : `Finished — ${batchOk} removed`);
    setTimeout(() => $("prog").style.width = "0", 800);
    updateBar();
  },
  scan_error: ({message}) => { $("summary").textContent = "Scan failed: " + message; grid.replaceChildren(); },
  error: ({message}) => toast("Error: " + message),
};
window.__emit = (ev, payload) => handlers[ev] && handlers[ev](payload);

// ---------- Cards ----------
function setStatus(uid, status) {
  const el = cards.get(uid); if (!el) return;
  const badge = el.querySelector(".badge");
  if (status) {
    el.dataset.s = status; badge.dataset.s = status;
    const spinning = status === "active" || status === "retrying";
    badge.innerHTML = (spinning ? '<i class="spin"></i>' : "") + LABELS[status];
  } else { delete el.dataset.s; badge.dataset.s = ""; badge.textContent = ""; }

  if (["done_success", "done_failed", "skipped"].includes(status)) {
    batchDone++; if (status === "done_success") batchOk++;
    $("prog").style.width = (batchDone / batchTotal * 100) + "%";
  }
  if (status === "done_success") {
    setTimeout(() => {
      el.classList.add("leaving");
      setTimeout(() => { el.remove(); cards.delete(uid); appsById.delete(uid); updateSummary(); }, 420);
    }, 900);
  }
}
function updateSummary() { $("summary").textContent = `${cards.size} apps remaining`; }

grid.addEventListener("click", e => {
  const el = e.target.closest(".card"); if (!el) return;
  const uid = +el.dataset.uid;
  if (e.target.closest('[data-act="logs"]')) { openDrawer(uid); return; }
  if (busy) return;
  if (selected.has(uid)) selected.delete(uid);
  else {
    selected.add(uid);
    if (el.dataset.s) setStatus(uid, null);          // re-selecting a failed/skipped app resets its badge
  }
  el.classList.toggle("selected", selected.has(uid));
  updateBar();
});

function updateBar() {
  const n = selected.size;
  $("count").textContent = busy ? "Working…" : `${n} selected`;
  $("go").disabled = busy || n === 0;
  $("clear").disabled = busy;
  bar.classList.toggle("show", busy || n > 0);
}
$("clear").onclick = () => {
  selected.forEach(uid => cards.get(uid)?.classList.remove("selected"));
  selected.clear(); updateBar();
};
$("go").onclick = async () => {
  if (busy || !selected.size) return;
  const uids = [...selected];
  busy = true; batchTotal = uids.length; batchDone = 0; batchOk = 0;
  $("prog").style.width = "0";
  // Mark as queued BEFORE calling Python, so status events that arrive first aren't overwritten.
  uids.forEach(uid => { cards.get(uid)?.classList.remove("selected"); setStatus(uid, "queue"); });
  selected.clear(); updateBar();
  const ok = await api().uninstall(uids);
  if (!ok) {
    busy = false; uids.forEach(uid => setStatus(uid, null)); updateBar();
    toast("Couldn't start — another job is still running");
  }
};

// ---------- Search ----------
let filterTimer;
$("q").addEventListener("input", () => { clearTimeout(filterTimer); filterTimer = setTimeout(applyFilter, 80); });
function applyFilter() {
  const q = $("q").value.trim().toLowerCase();
  let visible = 0;
  cards.forEach(el => { const show = !q || el.dataset.name.includes(q); el.hidden = !show; if (show) visible++; });
  grid.querySelector(".empty")?.remove();
  if (!visible && cards.size) grid.insertAdjacentHTML("beforeend", '<div class="empty">No apps match your search</div>');
}

// ---------- Log drawer ----------
let drawerUid = null, drawerData = {raw: [], friendly: []}, showRaw = false;
function appendLine(text) {
  const nearBottom = term.scrollHeight - term.scrollTop - term.clientHeight < 60;
  const d = document.createElement("div"); d.textContent = text; term.appendChild(d);
  if (nearBottom) term.scrollTop = term.scrollHeight;
}
function renderTerm() {
  term.replaceChildren();
  const lines = showRaw ? drawerData.raw : drawerData.friendly;
  if (!lines.length) term.innerHTML = '<div class="wait">Waiting for activity…</div>';
  else lines.forEach(appendLine);
  term.scrollTop = term.scrollHeight;
}
async function openDrawer(uid) {
  drawerUid = uid;
  $("dTitle").textContent = appsById.get(uid)?.name || "Logs";
  drawerData = await api().get_logs(uid);
  renderTerm();
  drawer.classList.add("show"); scrim.classList.add("show");
}
function closeDrawer() { drawerUid = null; drawer.classList.remove("show"); scrim.classList.remove("show"); }
$("dClose").onclick = closeDrawer; scrim.onclick = closeDrawer;
$("dToggle").onclick = () => { showRaw = !showRaw; $("dToggle").textContent = showRaw ? "Show friendly log" : "Show raw log"; renderTerm(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ---------- "App is in use" warning ----------
const modalQueue = []; let modalOpen = false;
function showNextModal() {
  if (modalOpen || !modalQueue.length) return;
  const {uid, processes} = modalQueue.shift(); modalOpen = true;
  const name = appsById.get(uid)?.name || "This app";
  const counts = {}; processes.forEach(p => counts[p] = (counts[p] || 0) + 1);
  const list = Object.entries(counts).map(([n, c]) => c > 1 ? `${n} ×${c}` : n).join("\n");

  const wrap = document.createElement("div"); wrap.className = "modal-wrap";
  wrap.innerHTML =
    `<div class="modal"><div class="ico">⚠</div>
       <h2>${esc(name)} is being used</h2>
       <p>It's still running, so removing it now may fail or leave files behind. You can close it yourself, or bypass and we'll close it for you.</p>
       <div class="procs">${esc(list).replace(/\n/g, "<br>")}</div>
       <div class="actions">
         <button class="btn ghost" data-r="0">Skip this app</button>
         <button class="btn danger" data-r="1">Bypass &amp; close it</button>
       </div></div>`;
  wrap.addEventListener("click", e => {
    const b = e.target.closest("[data-r]"); if (!b) return;
    api().resolve_in_use(uid, b.dataset.r === "1");
    wrap.classList.add("out");
    setTimeout(() => { wrap.remove(); modalOpen = false; showNextModal(); }, 200);
  });
  document.body.appendChild(wrap);
}

// ---------- Misc ----------
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

grid.innerHTML = '<div class="skel"></div>'.repeat(12);
window.addEventListener("pywebviewready", () => api().scan());
updateBar();
</script>
</body>
</html>
